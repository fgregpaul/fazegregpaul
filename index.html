<title>GregSnap</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P:wght@400&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
/* Layout: one phone-shaped vertical feed. Each slide is a playable game card with a rail on the right and a caption underneath. */
:root{
  --ink:#0c1615;
  --paper:#f2f6f1;
  --yellow:#ffe033;
  --coral:#ff5a4e;
  --mint:#5be3b0;
  --green:#12a06a;
  --stage:#050a0a;
  --bezel:#1a2423;
  --muted:#9fb3ad;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box;margin:0;background:var(--stage);color:var(--paper);
  font:400 14px/1.4 var(--body);
  display:flex;justify-content:center;align-items:center;overflow:hidden;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.phone{
  position:relative;flex:none;height:100%;max-height:880px;aspect-ratio:9/19;max-width:100%;min-width:0;
  border-radius:38px;overflow:hidden;background:#000;
  box-shadow:0 0 0 7px var(--bezel),0 30px 80px rgba(0,0,0,.6);
}
@media (max-width:520px){.phone{border-radius:22px}}

.top{
  position:absolute;top:0;left:0;right:0;height:58px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  pointer-events:none;color:var(--hdc,#fff);
}
.brand{display:flex;align-items:center;gap:8px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--hdc,#fff);color:var(--hdi,#111);display:grid;place-items:center;font:800 18px var(--display)}
.word{font:800 20px var(--display);letter-spacing:-.03em}
.live{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--hdd,#ccc);font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:#2fd08a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.feed{
  position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
  overscroll-behavior:contain;outline:none;
}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}

.play{
  position:absolute;top:58px;bottom:150px;left:10px;right:68px;border-radius:20px;overflow:hidden;
}
.play canvas{display:block;width:100%;height:100%;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.play canvas.hold{touch-action:none}

.rail{position:absolute;right:8px;bottom:150px;width:52px;display:flex;flex-direction:column;align-items:center;gap:9px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);box-shadow:0 0 0 2px var(--sfg,#fff)}
.rbtn{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:0;color:var(--sfg,#fff);font:500 11px var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.rbtn .ic{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--sfg,#fff) 16%,transparent);display:grid;place-items:center}
.rbtn svg{width:24px;height:24px}
.rbtn.on .ic{color:#ff3b5c}
.rbtn:focus-visible,.follow:focus-visible,.sheet button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:12px}
.rbtn.pulse .ic{animation:pop .3s}
@media (max-height:660px){.rbtn[data-act="next"]{display:none}}
@keyframes pop{50%{transform:scale(1.22)}}

.cap{
  position:absolute;left:0;right:0;bottom:0;height:150px;box-sizing:border-box;padding:10px 16px 14px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
}
.who{display:flex;align-items:center;gap:10px;font:600 14px var(--body);color:var(--sfg,#fff)}
.follow{border:1.5px solid var(--sfg,#fff);background:none;color:var(--sfg,#fff);border-radius:8px;padding:2px 10px;font:600 12px var(--body);cursor:pointer}
.follow.on{background:var(--sfg,#fff);color:var(--sbgc,#111)}
.ttl{font-family:var(--tfont,var(--display));font-weight:var(--tfw,800);font-size:var(--tsize,22px);line-height:1.08;letter-spacing:var(--tls,-.02em);text-transform:var(--tcase,none);color:var(--sfg,#fff);text-wrap:balance}
.desc{margin:0;font-size:13px;color:var(--sdim,#ddd);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{color:var(--stag,#ffe033);font-weight:600}
.music{display:flex;align-items:center;gap:8px;font:400 12px var(--mono);color:var(--sfg,#fff)}
.mq{overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.mq span{display:inline-block;padding-left:100%;animation:marq 10s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}

.scrim{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;height:56%;z-index:10;background:#111c1b;border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;
}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font:800 16px var(--display);border-bottom:1px solid rgba(242,246,241,.1)}
.sheet header button{background:none;border:0;color:var(--paper);font:600 13px var(--body);cursor:pointer;padding:4px 8px}
.sheet ul{list-style:none;margin:0;padding:12px 16px;overflow:auto;display:grid;gap:14px;align-content:start}
.sheet .u{font:500 12px var(--mono);color:var(--muted)}
.sheet .t{font-size:14px}

[hidden]{display:none!important}
.rbtn.dn .ic{background:#5b2fd6;color:#fff}
.rbtn.dn svg{width:27px;height:27px}
.who2{display:flex;align-items:center;gap:12px}
.av2{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--display);color:var(--ink);flex:none}
.who2 b{display:block;font:800 16px var(--display)}
.who2 small{display:block;font:500 11px var(--mono);color:var(--muted)}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;background:rgba(242,246,241,.08);color:var(--paper);font:500 13px var(--mono)}
.urlrow button{border:0;border-radius:10px;padding:0 14px;background:var(--paper);color:var(--ink);font:700 13px var(--body);cursor:pointer;min-width:96px}
.urlrow button:focus-visible,.linkbtn:focus-visible,.urlrow input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.linka{text-decoration:none}
.linkbtn{border:0;background:none;color:var(--yellow);font:600 13px var(--body);cursor:pointer;padding:6px;text-align:center}
.sdesc{margin:0;font:600 14px var(--body);color:var(--paper)}
.bt{display:grid;gap:2px;min-width:0}
.bt .word{line-height:1}
.galchip{pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;cursor:pointer;color:#fff;background:#5b2fd6;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:999px;padding:4px 5px 4px 10px;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.galchip svg{width:18px;height:18px;color:#fff;display:block}
.galchip .plus{width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font:800 16px/1 var(--body)}
.galchip:focus-visible,.spinbtn:focus-visible,.donate:focus-visible,.amts button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.crate{height:auto;max-height:84%}
.sheet.small{height:auto;max-height:80%}
.sheet header .hr{display:flex;gap:2px}
.cbody{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px 20px;display:grid;gap:12px;align-content:start}
.bal{display:flex;align-items:center;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);letter-spacing:.05em}
.bal b{display:flex;align-items:center;gap:8px;font:800 28px var(--display);color:var(--paper);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal b svg{width:24px;height:24px;color:#c9b8ff}
.reelwrap{position:relative;border-radius:14px;background:#0b1413;box-shadow:inset 0 0 0 1px rgba(242,246,241,.12);overflow:hidden}
.reelwrap::before,.reelwrap::after{content:"";position:absolute;top:0;bottom:0;width:48px;z-index:2;pointer-events:none}
.reelwrap::before{left:0;background:linear-gradient(90deg,#0b1413,transparent)}
.reelwrap::after{right:0;background:linear-gradient(270deg,#0b1413,transparent)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--yellow);z-index:3;box-shadow:0 0 12px rgba(255,224,51,.8)}
.marker::before,.marker::after{content:"";position:absolute;left:50%;margin-left:-7px;border:7px solid transparent}
.marker::before{top:0;border-top-color:var(--yellow)}
.marker::after{bottom:0;border-bottom-color:var(--yellow)}
.reel{padding:14px 0;overflow:hidden}
.strip{display:flex;will-change:transform}
.it{flex:none;width:88px;height:112px;margin-right:6px;border-radius:10px;background:#16201f;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--c) 28%,transparent),transparent 68%),#16201f;box-shadow:inset 0 0 0 1px rgba(242,246,241,.09);display:grid;place-items:center;align-content:center;gap:2px;text-align:center;color:var(--paper)}
.it svg{width:34px;height:34px;color:var(--c)}
.it b{font:800 20px var(--display);letter-spacing:-.02em}
.it small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.06em}
.it.none svg{opacity:.3}
.it.none b{font-size:14px;line-height:1.05;color:var(--muted)}
.it.dim{opacity:.35;transition:opacity .4s}
.it.win{box-shadow:inset 0 0 0 1px rgba(242,246,241,.55),0 0 24px rgba(255,255,255,.16);transform:scale(1.05)}
.result{margin:0;min-height:24px;text-align:center;font:800 19px var(--display);letter-spacing:-.01em;text-wrap:balance}
.spinbtn,.donate{border:0;border-radius:14px;padding:14px;cursor:pointer;font:800 17px var(--display);color:var(--ink);display:flex;justify-content:center;align-items:center;gap:10px}
.spinbtn{background:linear-gradient(90deg,var(--yellow),#ffb703)}
.donate{background:linear-gradient(90deg,var(--mint),#7dd6ff)}
.spinbtn small{font:500 11px var(--mono);background:rgba(12,22,21,.15);border-radius:999px;padding:2px 8px}
.spinbtn:disabled,.donate:disabled{opacity:.5;cursor:default}
.sub{margin:0;font:500 11px var(--mono);color:var(--muted);text-align:center}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amts button{border:0;border-radius:10px;padding:10px 4px;background:rgba(242,246,241,.08);color:var(--paper);font:600 13px var(--mono);cursor:pointer}
.amts button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.gift{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(138,92,255,.6),rgba(5,10,10,.82) 72%);animation:gfade 2.8s ease both}
.gwrap{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;padding:0 16px}
.gsw{width:150px;height:150px;color:#d9ccff;animation:gspin 2.4s cubic-bezier(.2,.7,.2,1) both}
.gsw svg{width:100%;height:100%;display:block}
.gl{margin:0;font:800 30px/1 var(--display);letter-spacing:-.02em;animation:gtext .6s .25s ease both}
.gsub{margin:0;font:500 12px var(--mono);color:rgba(242,246,241,.85);animation:gtext .6s .4s ease both}
.gift i{position:absolute;left:50%;top:30%;width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:gfly 1.6s .2s ease-out both}
@keyframes gfade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes gspin{0%{transform:rotate(-300deg) scale(.15)}100%{transform:rotate(30deg) scale(1.05)}}
@keyframes gtext{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gfly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.gift,.gift *{animation:none!important}}

@media (prefers-reduced-motion:reduce){
  .mq span,.live i{animation:none}
  .mq span{padding-left:0}
  .sheet{transition:none}
}
</style>

<main class="phone" id="phone">
  <div class="top">
    <div class="brand"><span class="mark">G</span><div class="bt"><span class="word">GregSnap</span><div class="live"><i></i><span id="online">4,812,330,119</span> online</div></div></div>
    <button type="button" class="galchip" id="galchip" aria-label="Open Galaxy Crate"><span id="galIcon"></span><span id="galn">0</span><span class="plus">+</span></button>
  </div>
  <div class="feed" id="feed" tabindex="0" aria-label="GregSnap game feed"></div>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" aria-label="Comments">
    <header><span id="sheetTitle">Comments</span><button type="button" data-closeall>Close</button></header>
    <ul id="sheetList"></ul>
  </section>
  <section class="sheet crate" id="crate" aria-label="Galaxy Crate">
    <header><span>Galaxy Crate</span><span class="hr"><button type="button" id="snd" aria-pressed="true">Sound on</button><button type="button" data-closeall>Close</button></span></header>
    <div class="cbody" id="paneCrate">
      <div class="bal"><span>YOUR GALAXIES</span><b><span id="balIcon"></span><span id="balN">0</span></b></div>
      <div class="reelwrap"><div class="marker"></div><div class="reel" id="reel"><div class="strip" id="strip"></div></div></div>
      <p class="result" id="result" aria-live="polite">Open a crate. Win galaxies. Or don't.</p>
      <button type="button" class="spinbtn" id="openBtn">OPEN CRATE <small>$10.00</small></button>
      <p class="sub">Crates opened: <span id="openedN">0</span></p>
    </div>
  </section>
  <section class="sheet small" id="dsheet" aria-label="Donate galaxies">
    <header><span>Donate galaxies</span><button type="button" data-closeall>Close</button></header>
    <div class="cbody">
      <div class="who2"><span class="av2" id="dAv"></span><div><b id="dName"></b><small id="dGame"></small></div></div>
      <div class="bal"><span>YOUR GALAXIES</span><b><span id="dBalIcon"></span><span id="dBal">0</span></b></div>
      <div class="amts" id="amts">
        <button type="button" data-amt="10" aria-pressed="true">10</button>
        <button type="button" data-amt="100" aria-pressed="false">100</button>
        <button type="button" data-amt="1000" aria-pressed="false">1,000</button>
        <button type="button" data-amt="all" aria-pressed="false">ALL</button>
      </div>
      <button type="button" class="donate" id="donateBtn">DONATE</button>
      <p class="sub" id="dHint"></p>
      <button type="button" class="linkbtn" id="getMore">Get more galaxies</button>
    </div>
  </section>
  <section class="sheet small" id="ssheet" aria-label="Share">
    <header><span>Share</span><button type="button" data-closeall>Close</button></header>
    <div class="cbody">
      <p class="sdesc" id="sTitle"></p>
      <div class="urlrow"><input id="shareUrl" type="text" readonly value="https://fazegregpaul.com" aria-label="Link to share"><button type="button" id="copyBtn">Copy link</button></div>
      <a class="spinbtn linka" id="openSite" href="https://fazegregpaul.com" target="_blank" rel="noopener">Open fazegregpaul.com</a>
    </div>
  </section>
  <div class="gift" id="gift" hidden aria-hidden="true">
    <div class="gwrap">
      <i style="--x:-130px;--y:-90px"></i><i style="--x:130px;--y:-80px"></i><i style="--x:-100px;--y:110px"></i><i style="--x:110px;--y:120px"></i>
      <i style="--x:-40px;--y:-150px"></i><i style="--x:50px;--y:-140px"></i><i style="--x:-150px;--y:20px"></i><i style="--x:150px;--y:30px"></i>
      <div class="gsw" id="giftIcon"></div>
      <p class="gl" id="giftTitle"></p>
      <p class="gsub" id="giftSub"></p>
    </div>
  </div>
</main>

<script>
(() => {
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = n => n >= 1e12 ? (n / 1e12).toFixed(2) + 'T' : n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n));
  const shuf = a => a.slice().sort(() => Math.random() - 0.5);
  const DISPLAY = 'D', MONO = 'M';
  const lum = h => { const n = parseInt(h.slice(1), 16); return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
  const onC = h => (typeof h === 'string' && h[0] === '#' && h.length === 7) ? (lum(h) > 0.6 ? '#111111' : '#ffffff') : '#111111';
  const mulberry = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  /* ---------- skins: every game gets its own look, as if a different person made it ---------- */
  const SKINS = {};
  const skin = (name, o) => (SKINS[name] = Object.assign({
    lw: 0, hard: 0, soft: 0, r: 10, sq: false, glow: 0, scan: false, bevel: false, sketch: false, pat: 'none', patc: 'rgba(0,0,0,.08)',
    fs: 1, ms: 1, fw: 700, mw: 500, case: null, dcase: null, veil: 'rgba(0,0,0,.55)', vfg: '#ffffff', dark: false,
    sh: '#000000', shc: 'rgba(0,0,0,.22)', tsize: 22, tls: '-.01em', tcase: 'none', frame: ''
  }, o, { name }));

  skin('comic', {
    bg: ['#ffe94d', '#ffd21f'], pat: 'halftone', patc: 'rgba(232,33,47,.24)', fg: '#111111', dim: '#6b5200', panel: '#ffffff', pfg: '#111111',
    line: '#111111', lw: 3.5, hard: 5, sh: '#111111', r: 6, pal: ['#e8212f', '#1f6fff', '#0fbf6a', '#ff8a00'], good: '#0a9d52', bad: '#e8212f',
    font: '"Bangers","Impact","Arial Black",sans-serif', fw: 400, fs: 1.2, mono: '"Comic Neue","Comic Sans MS",cursive', mw: 700, ms: 1,
    veil: 'rgba(255,233,77,.8)', vfg: '#111111',
    slide: '#2f6bff', sbgc: '#2f6bff', sfg: '#ffffff', sdim: '#dbe6ff', stag: '#ffe94d', tsize: 30, tfw: 400, tls: '.02em',
    frame: 'border:4px solid #111;border-radius:10px;box-shadow:7px 7px 0 #111'

  $('getMore').addEventListener('click', () => showSheet(crate));

  /* share */
  function openShare(i) { $('sTitle').textContent = 'Send ' + SLIDES[i].title + ' to a friend'; $('copyBtn').textContent = 'Copy link'; showSheet(ssheet); }
  $('copyBtn').addEventListener('click', () => {
    const url = $('shareUrl'), btn = $('copyBtn');
    const done = ok => { btn.textContent = ok ? 'Copied' : 'Link selected'; setTimeout(() => { btn.textContent = 'Copy link'; }, 1800); };
    const fallback = () => { url.focus(); url.select(); url.setSelectionRange(0, 99); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} done(ok); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url.value).then(() => done(true), fallback); else fallback();
  });
  setGal();

  document.getElementById('phone').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const slide = b.closest('.slide'); const i = slide ? +slide.dataset.i : cur; const s = SLIDES[i];
    const act = b.dataset.act;
    const pulse = () => { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); };
    if (act === 'like') { s.liked = !s.liked; s.likes += s.liked ? 69e6 : -69e6; b.classList.toggle('on', s.liked); b.querySelector('.n').textContent = fmt(s.likes); pulse(); }
    else if (act === 'share') { s.shares += 21e6; b.querySelector('.n').textContent = fmt(s.shares); pulse(); openShare(i); }
    else if (act === 'donate') openDonate(i);
    else if (act === 'comment') openSheet(i);
    else if (act === 'next') go(1);
    else if (act === 'follow') { const on = b.classList.toggle('on'); b.textContent = on ? 'Following' : 'Follow'; }
  });

  addEventListener('keydown', e => {
    if (paused) { if (e.code === 'Escape') closeAll(); else rigKey(e); return; }
    if (e.code === 'Escape') closeAll();
    else if (games[cur] && games[cur].key && games[cur].key(e)) { e.preventDefault(); }
    else if (e.code === 'Space') { const g = games[cur]; if (g && g.tap) { e.preventDefault(); g.tap(); } }
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { const g = games[cur]; if (g && g.swipe) { e.preventDefault(); g.swipe(e.code === 'ArrowRight' ? 1 : -1); } }
    else if (e.code === 'ArrowDown') { e.preventDefault(); go(1); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); go(-1); }
  });

  /* live user counter */
  let users = 4812330119;
  const onl = document.getElementById('online');
  setInterval(() => { users += Math.floor(rand(200, 900)); onl.textContent = users.toLocaleString('en-US'); }, 140);

  feed.focus({ preventScroll: true });
  requestAnimationFrame(frame);
})();
</script>

</body></html>
