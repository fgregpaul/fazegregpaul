<style>
/* Layout: one phone-shaped vertical feed. Each slide is a playable game card with a rail on the right and a caption underneath. */
:root{
  --ink:#0c1615;
  --paper:#f2f6f1;
  --yellow:#ffe033;
  --coral:#ff5a4e;
  --mint:#5be3b0;
  --green:#12a06a;
  --stage:#050a0a;
  --bezel:#1a2423;
  --muted:#9fb3ad;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box;margin:0;background:var(--stage);color:var(--paper);
  font:400 14px/1.4 var(--body);
  display:flex;justify-content:center;align-items:center;overflow:hidden;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.phone{
  position:relative;flex:none;height:100%;max-height:880px;aspect-ratio:9/19;max-width:100%;min-width:0;
  border-radius:38px;overflow:hidden;background:#000;
  box-shadow:0 0 0 7px var(--bezel),0 30px 80px rgba(0,0,0,.6);
}
@media (max-width:520px){.phone{border-radius:22px}}

.top{
  position:absolute;top:0;left:0;right:0;height:58px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  pointer-events:none;color:var(--hdc,#fff);
}
.brand{display:flex;align-items:center;gap:8px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--hdc,#fff);color:var(--hdi,#111);display:grid;place-items:center;font:800 18px var(--display)}
.word{font:800 20px var(--display);letter-spacing:-.03em}
.live{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--hdd,#ccc);font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:#2fd08a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.feed{
  position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
  overscroll-behavior:contain;outline:none;
}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}

.play{
  position:absolute;inset:0;overflow:hidden;
}
.play canvas{display:block;width:100%;height:100%;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.play canvas.hold{touch-action:none}

.rail{position:absolute;right:8px;bottom:150px;width:52px;display:flex;flex-direction:column;align-items:center;gap:9px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);box-shadow:0 0 0 2px var(--sfg,#fff)}
.rbtn{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:0;color:var(--sfg,#fff);font:500 11px var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.rbtn .ic{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--sfg,#fff) 16%,transparent);display:grid;place-items:center}
.rbtn svg{width:24px;height:24px}
.rbtn.on .ic{color:#ff3b5c}
.rbtn:focus-visible,.follow:focus-visible,.sheet button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:12px}
.rbtn.pulse .ic{animation:pop .3s}
@media (max-height:660px){.rbtn[data-act="next"]{display:none}}
@keyframes pop{50%{transform:scale(1.22)}}

.cap{
  position:absolute;left:0;right:0;bottom:0;height:150px;box-sizing:border-box;padding:10px 16px 14px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:linear-gradient(to bottom,transparent,var(--capbg,transparent) 36%);
}
.who{display:flex;align-items:center;gap:10px;font:600 14px var(--body);color:var(--sfg,#fff)}
.follow{border:1.5px solid var(--sfg,#fff);background:none;color:var(--sfg,#fff);border-radius:8px;padding:2px 10px;font:600 12px var(--body);cursor:pointer}
.follow.on{background:var(--sfg,#fff);color:var(--sbgc,#111)}
.ttl{font-family:var(--tfont,var(--display));font-weight:var(--tfw,800);font-size:var(--tsize,22px);line-height:1.08;letter-spacing:var(--tls,-.02em);text-transform:var(--tcase,none);color:var(--sfg,#fff);text-wrap:balance}
.desc{margin:0;font-size:13px;color:var(--sdim,#ddd);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{color:var(--stag,#ffe033);font-weight:600}
.music{display:flex;align-items:center;gap:8px;font:400 12px var(--mono);color:var(--sfg,#fff)}
.mq{overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.mq span{display:inline-block;padding-left:100%;animation:marq 10s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}

.scrim{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;height:56%;z-index:10;background:#111c1b;border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;
}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font:800 16px var(--display);border-bottom:1px solid rgba(242,246,241,.1)}
.sheet header button{background:none;border:0;color:var(--paper);font:600 13px var(--body);cursor:pointer;padding:4px 8px}
.sheet ul{list-style:none;margin:0;padding:12px 16px;overflow:auto;display:grid;gap:14px;align-content:start}
.sheet .u{font:500 12px var(--mono);color:var(--muted)}
.sheet .t{font-size:14px}
.sheet .lk{float:right;color:var(--muted)}

[hidden]{display:none!important}
.rbtn.dn .ic{background:#5b2fd6;color:#fff}
.rbtn.dn svg{width:27px;height:27px}
.who2{display:flex;align-items:center;gap:12px}
.av2{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--display);color:var(--ink);flex:none}
.who2 b{display:block;font:800 16px var(--display)}
.who2 small{display:block;font:500 11px var(--mono);color:var(--muted)}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;background:rgba(242,246,241,.08);color:var(--paper);font:500 13px var(--mono)}
.urlrow button{border:0;border-radius:10px;padding:0 14px;background:var(--paper);color:var(--ink);font:700 13px var(--body);cursor:pointer;min-width:96px}
.urlrow button:focus-visible,.linkbtn:focus-visible,.urlrow input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.linka{text-decoration:none}
.linkbtn{border:0;background:none;color:var(--yellow);font:600 13px var(--body);cursor:pointer;padding:6px;text-align:center}
.sdesc{margin:0;font:600 14px var(--body);color:var(--paper)}
.bt{display:grid;gap:2px;min-width:0}
.bt .word{line-height:1}
.galchip{pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;cursor:pointer;color:#fff;background:#5b2fd6;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:999px;padding:4px 5px 4px 10px;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.galchip svg{width:18px;height:18px;color:#fff;display:block}
.galchip .plus{width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font:800 16px/1 var(--body)}
.galchip:focus-visible,.spinbtn:focus-visible,.donate:focus-visible,.amts button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.crate{height:auto;max-height:84%}
.sheet.small{height:auto;max-height:80%}
.sheet header .hr{display:flex;gap:2px}
.cbody{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px 20px;display:grid;gap:12px;align-content:start}
.bal{display:flex;align-items:center;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);letter-spacing:.05em}
.bal b{display:flex;align-items:center;gap:8px;font:800 28px var(--display);color:var(--paper);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal b svg{width:24px;height:24px;color:#c9b8ff}
.reelwrap{position:relative;border-radius:14px;background:#0b1413;box-shadow:inset 0 0 0 1px rgba(242,246,241,.12);overflow:hidden}
.reelwrap::before,.reelwrap::after{content:"";position:absolute;top:0;bottom:0;width:48px;z-index:2;pointer-events:none}
.reelwrap::before{left:0;background:linear-gradient(90deg,#0b1413,transparent)}
.reelwrap::after{right:0;background:linear-gradient(270deg,#0b1413,transparent)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--yellow);z-index:3;box-shadow:0 0 12px rgba(255,224,51,.8)}
.marker::before,.marker::after{content:"";position:absolute;left:50%;margin-left:-7px;border:7px solid transparent}
.marker::before{top:0;border-top-color:var(--yellow)}
.marker::after{bottom:0;border-bottom-color:var(--yellow)}
.reel{padding:14px 0;overflow:hidden}
.strip{display:flex;will-change:transform}
.it{flex:none;width:88px;height:112px;margin-right:6px;border-radius:10px;background:#16201f;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--c) 28%,transparent),transparent 68%),#16201f;box-shadow:inset 0 0 0 1px rgba(242,246,241,.09);display:grid;place-items:center;align-content:center;gap:2px;text-align:center;color:var(--paper)}
.it svg{width:34px;height:34px;color:var(--c)}
.it b{font:800 20px var(--display);letter-spacing:-.02em}
.it small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.06em}
.it.none svg{opacity:.3}
.it.none b{font-size:14px;line-height:1.05;color:var(--muted)}
.it.dim{opacity:.35;transition:opacity .4s}
.it.win{box-shadow:inset 0 0 0 1px rgba(242,246,241,.55),0 0 24px rgba(255,255,255,.16);transform:scale(1.05)}
.result{margin:0;min-height:24px;text-align:center;font:800 19px var(--display);letter-spacing:-.01em;text-wrap:balance}
.spinbtn,.donate{border:0;border-radius:14px;padding:14px;cursor:pointer;font:800 17px var(--display);color:var(--ink);display:flex;justify-content:center;align-items:center;gap:10px}
.spinbtn{background:linear-gradient(90deg,var(--yellow),#ffb703)}
.donate{background:linear-gradient(90deg,var(--mint),#7dd6ff)}
.spinbtn small{font:500 11px var(--mono);background:rgba(12,22,21,.15);border-radius:999px;padding:2px 8px}
.spinbtn:disabled,.donate:disabled{opacity:.5;cursor:default}
.sub{margin:0;font:500 11px var(--mono);color:var(--muted);text-align:center}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amts button{border:0;border-radius:10px;padding:10px 4px;background:rgba(242,246,241,.08);color:var(--paper);font:600 13px var(--mono);cursor:pointer}
.amts button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.gift{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(138,92,255,.6),rgba(5,10,10,.82) 72%);animation:gfade 2.8s ease both}
.gwrap{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;padding:0 16px}
.gsw{width:150px;height:150px;color:#d9ccff;animation:gspin 2.4s cubic-bezier(.2,.7,.2,1) both}
.gsw svg{width:100%;height:100%;display:block}
.gl{margin:0;font:800 30px/1 var(--display);letter-spacing:-.02em;animation:gtext .6s .25s ease both}
.gsub{margin:0;font:500 12px var(--mono);color:rgba(242,246,241,.85);animation:gtext .6s .4s ease both}
.gift i{position:absolute;left:50%;top:30%;width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:gfly 1.6s .2s ease-out both}
@keyframes gfade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes gspin{0%{transform:rotate(-300deg) scale(.15)}100%{transform:rotate(30deg) scale(1.05)}}
@keyframes gtext{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gfly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.gift,.gift *{animation:none!important}}

@media (prefers-reduced-motion:reduce){
  .mq span,.live i{animation:none}
  .mq span{padding-left:0}
  .sheet{transition:none}
}

/* ---- layout v2: true full-screen on phones, TikTok-style card on desktop ---- */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--railw:62px}
html,body{height:100%;height:100dvh}
html{background:var(--stage)}
body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
.top{box-sizing:border-box;height:calc(60px + var(--sat));padding:var(--sat) max(16px,var(--sar)) 0 max(16px,var(--sal))}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--sat);background:linear-gradient(rgba(0,0,0,.24),transparent);pointer-events:none}
.cap{height:auto;min-height:0;box-sizing:border-box;padding:30px max(18px,var(--sar)) calc(var(--sab) + 8px) max(18px,var(--sal));gap:7px;background:linear-gradient(to bottom,transparent,var(--capbg,transparent) 30%)}
.cap .who{min-height:26px}
.cap .desc{line-height:1.38}
.cap .music{min-height:18px}
.gp{margin-top:1px;text-align:center;font:500 10px/14px var(--mono);letter-spacing:.08em;color:var(--sfg,#fff);opacity:.5;pointer-events:none;user-select:none}
.rail{bottom:calc(var(--caph,170px) + 8px);right:max(8px,var(--sar));gap:15px}
.sheet{padding-bottom:var(--sab)}
.navs{display:none}

@media (max-width:699px){
  body{display:block;padding:0}
  .phone{position:fixed;inset:0;width:auto;height:auto;max-width:none;max-height:none;aspect-ratio:auto;border-radius:0;box-shadow:none;background:transparent}
  .rbtn[data-act="next"]{display:none}
  .pwa .phone{bottom:auto;height:var(--apph,100%)}
  .pwa .cap{padding-bottom:max(calc(var(--sab) + 8px),28px)}
}
@media (max-width:699px) and (max-height:700px){ .cap .desc{-webkit-line-clamp:1} }

@media (min-width:700px){
  :root{--railw:0px}
  html,body{background:var(--stage)}
  body{padding:0;display:flex;justify-content:center;align-items:center}
  .phone{--cardh:min(calc(100dvh - 28px),1040px);--cardw:min(calc(var(--cardh) * 9 / 16),calc(100vw - 200px));
    width:var(--cardw);height:var(--cardh);max-width:none;max-height:none;aspect-ratio:auto;border-radius:16px;
    box-shadow:0 0 0 1px rgba(255,255,255,.09),0 24px 70px rgba(0,0,0,.55)}
  .rail{--sfg:#fff;position:fixed;right:auto;top:auto;
    left:calc(50vw + var(--cardw) / 2 + 18px);bottom:calc((100dvh - var(--cardh)) / 2 + 22px);gap:16px;z-index:6}
  .slide:not(.is-cur) .rail{visibility:hidden}
  .rbtn[data-act="next"]{display:none}
  .navs{display:flex;flex-direction:column;gap:12px;position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:6}
  .navb{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
  .navb:hover{background:rgba(255,255,255,.2)}
  .navb:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .navb svg{width:22px;height:22px}
}
</style>

<main class="phone" id="phone">
  <div class="top">
    <div class="brand"><span class="mark">G</span><div class="bt"><span class="word">GregSnap</span><div class="live"><i></i><span id="online">4,812,330,119</span> online</div></div></div>
    <button type="button" class="galchip" id="galchip" aria-label="Open Galaxy Crate"><span id="galIcon"></span><span id="galn">0</span><span class="plus">+</span></button>
  </div>
  <div class="feed" id="feed" tabindex="0" aria-label="GregSnap game feed"></div>
  <div class="navs"><button type="button" class="navb" id="navUp" aria-label="Previous game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button><button type="button" class="navb" id="navDn" aria-label="Next game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" aria-label="Comments">
    <header><span id="sheetTitle">Comments</span><button type="button" data-closeall>Close</button></header>
    <ul id="sheetList"></ul>
  </section>
  <section class="sheet crate" id="crate" aria-label="Galaxy Crate">
    <header><span>Galaxy Crate</span><span class="hr"><button type="button" id="snd" aria-pressed="true">Sound on</button><button type="button" id="mus" aria-pressed="false">Music off</button><button type="button" data-closeall>Close</button></span></header>
    <div class="cbody" id="paneCrate">
      <div class="bal"><span>YOUR GALAXIES</span><b><span id="balIcon"></span><span id="balN">0</span></b></div>
      <div class="reelwrap"><div class="marker"></div><div class="reel" id="reel"><div class="strip" id="strip"></div></div></div>
      <p class="result" id="result" aria-live="polite">Open a crate. Win galaxies. Or don't.</p>
      <button type="button" class="spinbtn" id="openBtn">OPEN CRATE <small>$10.00</small></button>
      <p class="sub">Crates opened: <span id="openedN">0</span></p>
    </div>
  </section>
  <section class="sheet small" id="dsheet" aria-label="Donate galaxies">
    <header><span>Donate galaxies</span><button type="button" data-closeall>Close</button></header>
    <div class="cbody">
      <div class="who2"><span class="av2" id="dAv"></span><div><b id="dName"></b><small id="dGame"></small></div></div>
      <div class="bal"><span>YOUR GALAXIES</span><b><span id="dBalIcon"></span><span id="dBal">0</span></b></div>
      <div class="amts" id="amts">
        <button type="button" data-amt="10" aria-pressed="true">10</button>
        <button type="button" data-amt="100" aria-pressed="false">100</button>
        <button type="button" data-amt="1000" aria-pressed="false">1,000</button>

    mk(makeSimon(SKINS.slime, ['SUN', 'MOON', 'STAR', 'CLOUD']), 'Echo', SKINS.slime, 'Watch the pattern, then repeat it. It speeds up.', '#memory #simon #gaming', 1.6e9, 220e6, 31e6, 'simon'),
    mk(makeHL(SKINS.swiss), 'Stat Check', SKINS.swiss, 'Higher or lower? Guess which number is bigger.', '#higherlower #trivia #fyp', 4.9e9, 1.1e9, 150e6, 'hl'),
    mk(makeBeat(SKINS.seventies), 'Beat Drop', SKINS.seventies, 'Tap the lane when the block lands. Gets fast.', '#rhythm #beat #minigames', 8.1e9, 2.6e9, 710e6, 'beat'),
    mk(makeSling(SKINS.notebook, 'PIG'), 'Pig Launch', SKINS.notebook, 'Pull back, let go, hit the pig. It keeps moving.', '#slingshot #aim #viral', 3.7e9, 880e6, 205e6, 'sling')
  ];

  /* ===== stage 4a: worm (slither), blobs (agar), hole, quest (dungeon) ===== */
  const worldFrame = (c, g, cx, cy, z, fn) => {
    c.save(); c.beginPath(); c.rect(-g.ox, -g.oy, g.W, g.H); c.clip();
    c.translate(g.w / 2, g.h / 2); c.scale(z, z); c.translate(-cx, -cy);
    fn(); c.restore();
  };
  const worldGrid = (c, g, cx, cy, z, step, col) => {
    const x0 = cx - g.W / 2 / z - 80, x1 = cx + g.W / 2 / z + 80, y0 = cy - g.H / 2 / z - 80, y1 = cy + g.H / 2 / z + 80;
    c.strokeStyle = col; c.lineWidth = 1 / z * 1.2; c.beginPath();
    for (let x = Math.floor(x0 / step) * step; x <= x1; x += step) { c.moveTo(x, y0); c.lineTo(x, y1); }
    for (let y = Math.floor(y0 / step) * step; y <= y1; y += step) { c.moveTo(x0, y); c.lineTo(x1, y); }
    c.stroke();
  };
  const pointerAim = (g, cv) => {
    g.ptr = null;
    const at = e => { const r = cv.getBoundingClientRect(); g.ptr = { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener('pointerdown', e => { if (g.kick()) return; g.down = true; at(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
    cv.addEventListener('pointermove', e => { if (g.down || e.pointerType === 'mouse') at(e); });
    ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { g.down = false; }));
  };

  /* --- slither: Worm --- */
  function makeWorm(sk) {
    const WR = 1250, SP = 8, SPEED = 150, NB = 9, NFOOD = 650;
    const mkSnake = (x, y, ang, len, ai, col) => {
      const segs = []; for (let i = 0; i < len; i++) segs.push({ x: x - Math.cos(ang) * SP * i, y: y - Math.sin(ang) * SP * i });
      return { segs, ang, ai, col, grow: 0, tt: 0, want: ang, name: ai ? rname() : 'you', dead: 0 };
    };
    return Object.assign({
      sk, hold: true, title: 'Worm', how: 'Steer with your finger. Eat dots. Do not hit other worms.',
      state: 'ready', score: 0, best: 0, dead: 0, shake: 0, flash: 0, floats: [], p: null, bots: [], food: [], ptr: null, down: false, keys: {}, t: 0, kills: 0,
      layout() { },
      rr() { const a = rand(0, TAU), d = Math.sqrt(Math.random()) * (WR - 80); return [Math.cos(a) * d, Math.sin(a) * d]; },
      mkFood() { const q = this.rr(); return { x: q[0], y: q[1], v: 1, c: Math.floor(rand(0, 4)) }; },
      mkBot() { const q = this.rr(); return mkSnake(q[0], q[1], rand(0, TAU), Math.floor(rand(10, 40)), true, Math.floor(rand(0, 4))); },
      reset() {
        this.p = mkSnake(0, 0, -Math.PI / 2, 14, false, 0); this.bots = []; for (let i = 0; i < NB; i++) this.bots.push(this.mkBot());
        this.food = []; for (let i = 0; i < NFOOD; i++) this.food.push(this.mkFood()); this.floats = []; this.t = 0; this.kills = 0; this.score = 14; this.keys = {}; this.state = 'ready';
      },
      enter() { this.reset(); },
      key(e) { const m = { ArrowLeft: 'l', ArrowRight: 'r', KeyA: 'l', KeyD: 'r' }[e.code]; if (!m || this.state !== 'run') return false; this.keys[m] = e.type === 'keydown'; return true; },
      bind(cv) {
        pointerAim(this, cv);
        window.addEventListener('keyup', e => { const m = { ArrowLeft: 'l', ArrowRight: 'r', KeyA: 'l', KeyD: 'r' }[e.code]; if (m) this.keys[m] = false; });
      },
      radius(s) { return 7 + Math.min(9, s.segs.length / 28); },
      move(s, dt, sp) {
        const h = s.segs[0]; h.x += Math.cos(s.ang) * sp * dt; h.y += Math.sin(s.ang) * sp * dt;
        for (let i = 1; i < s.segs.length; i++) {
          const a = s.segs[i - 1], b = s.segs[i], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
          if (d > SP) { b.x += dx / d * (d - SP); b.y += dy / d * (d - SP); }
        }
        if (s.grow >= 1) { const t = s.segs[s.segs.length - 1]; s.segs.push({ x: t.x, y: t.y }); s.grow -= 1; }
      },
      kill(s, byPlayer) {
        for (let i = 0; i < s.segs.length; i += 2) { const q = s.segs[i]; this.food.push({ x: q.x + rand(-6, 6), y: q.y + rand(-6, 6), v: 2, c: s.col }); }
        if (byPlayer) { this.kills++; this.floats.push({ t: 'KO ' + s.name, x: this.w / 2, y: this.h * 0.35, age: 0, c: 'good' }); sfx(700, 0.15, 0.06); }
      },
      tick(dt) {
        this.decay(dt);
        if (this.state === 'dead') { this.dead += dt; return; }
        if (this.state !== 'run') return;
        this.t += dt; const p = this.p;
        // steer
        let want = p.ang;
        if (this.ptr) { const dx = this.ptr.x - this.w / 2, dy = this.ptr.y - this.h / 2; if (Math.hypot(dx, dy) > 12) want = Math.atan2(dy, dx); }
        if (this.keys.l) want = p.ang - 2; if (this.keys.r) want = p.ang + 2;
        let d = want - p.ang; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; p.ang += clamp(d, -5.6 * dt, 5.6 * dt);
        this.move(p, dt, SPEED);
        // bots
        this.bots.forEach((b, bi) => {
          if (b.dead > 0) { b.dead -= dt; if (b.dead <= 0) this.bots[bi] = this.mkBot(); return; }
          b.tt -= dt; const h = b.segs[0];
          if (b.tt <= 0) {
            b.tt = rand(0.3, 0.9); let best = null, bd = 260 * 260;
            for (let i = 0; i < this.food.length; i += 3) { const f = this.food[i], dd = (f.x - h.x) ** 2 + (f.y - h.y) ** 2; if (dd < bd) { bd = dd; best = f; } }
            b.want = best ? Math.atan2(best.y - h.y, best.x - h.x) : b.ang + rand(-1.2, 1.2);
          }
          if (Math.hypot(h.x, h.y) > WR - 140) b.want = Math.atan2(-h.y, -h.x);
          let dd = b.want - b.ang; while (dd > Math.PI) dd -= TAU; while (dd < -Math.PI) dd += TAU; b.ang += clamp(dd, -3.4 * dt, 3.4 * dt);
          this.move(b, dt, SPEED * 0.95);
        });
        // food
        const eat = (s, isP) => {
          const h = s.segs[0], r = this.radius(s) + 15;
          for (let i = this.food.length - 1; i >= 0; i--) {
            const f = this.food[i];
            if ((f.x - h.x) ** 2 + (f.y - h.y) ** 2 < r * r) { s.grow += f.v * 0.5; this.food.splice(i, 1); if (isP) { sfx(500 + (i % 5) * 40, 0.04, 0.03); } if (this.food.length < NFOOD) this.food.push(this.mkFood()); }
          }
        };
        eat(p, true); this.bots.forEach(b => { if (b.dead <= 0) eat(b, false); });
        this.score = p.segs.length; this.best = Math.max(this.best, this.score);
        // collisions
        const ph = p.segs[0], pr = this.radius(p);
        if (Math.hypot(ph.x, ph.y) > WR) { this.die(); return; }
        for (const b of this.bots) {
          if (b.dead > 0) continue; const br = this.radius(b);
          for (let i = 2; i < b.segs.length; i += 1) { const q = b.segs[i]; if ((q.x - ph.x) ** 2 + (q.y - ph.y) ** 2 < (pr + br - 2) ** 2) { this.die(); return; } }
        }
        this.bots.forEach(b => {
          if (b.dead > 0) return; const h = b.segs[0], br = this.radius(b);
          if (Math.hypot(h.x, h.y) > WR) { this.kill(b, false); b.dead = 3; return; }
          for (let i = 2; i < p.segs.length; i++) { const q = p.segs[i]; if ((q.x - h.x) ** 2 + (q.y - h.y) ** 2 < (pr + br - 2) ** 2) { this.kill(b, true); b.dead = 3; return; } }
          for (const o of this.bots) { if (o === b || o.dead > 0) continue; for (let i = 2; i < o.segs.length; i++) { const q = o.segs[i]; if ((q.x - h.x) ** 2 + (q.y - h.y) ** 2 < (br + this.radius(o) - 2) ** 2) { this.kill(b, false); b.dead = 3; return; } } }
        });
      },
      die() { this.shake = 0.8; this.flash = 0.5; sfx(140, 0.4, 0.07, 'sawtooth'); buzz(80); this.kill(this.p, false); this.finish(); },
      draw() {
        const c = this.ctx, w = this.w, h = this.h, sk = SK, p = this.p, hd = p.segs[0], z = clamp(1.05 - p.segs.length / 520, 0.55, 1.05);
        drawBg(c, w, h);
        const body = (s, isP) => {
          const r = this.radius(s), col = [sk.pal[s.col % 4], sk.pal[(s.col + 1) % 4]];
          for (let i = s.segs.length - 1; i >= 0; i--) { const q = s.segs[i]; dot(c, q.x, q.y, r, col[Math.floor(i / 3) % 2], { lw: sk.lw ? Math.min(2, sk.lw) : 0 }); }
          const q = s.segs[0], ex = Math.cos(s.ang), ey = Math.sin(s.ang);
          [-1, 1].forEach(sd => { const px = q.x + ex * r * 0.4 - ey * sd * r * 0.5, py = q.y + ey * r * 0.4 + ex * sd * r * 0.5; dot(c, px, py, r * 0.32, '#ffffff', { lw: 0 }); dot(c, px + ex * r * 0.1, py + ey * r * 0.1, r * 0.15, '#111111', { lw: 0 }); });
          if (!isP && s.name) txt(c, s.name, q.x, q.y - r - 9, 11 / z, sk.fg, 'center', MONO);
        };
        worldFrame(c, this, hd.x, hd.y, z, () => {
          worldGrid(c, this, hd.x, hd.y, z, 60, sk.dark ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.07)');
          c.beginPath(); c.rect(-3000, -3000, 6000, 6000); c.arc(0, 0, WR, 0, TAU, true); c.fillStyle = 'rgba(0,0,0,.38)'; c.fill('evenodd');
          c.beginPath(); c.arc(0, 0, WR, 0, TAU); c.lineWidth = 6; c.strokeStyle = sk.bad; c.stroke();
          this.food.forEach(f => { const x = f.x - hd.x, y = f.y - hd.y; if (Math.abs(x) > this.W / z / 2 + 20 || Math.abs(y) > this.H / z / 2 + 20) return; dot(c, f.x, f.y, f.v > 1 ? 6 : 4.5, sk.pal[f.c % 4], { lw: 0 }); });
          this.bots.forEach(b => { if (b.dead <= 0) body(b, false); });
          body(p, true);
        });
        drawFloats(c, this);
        hud(c, this, 'LENGTH', 0, 0); txt(c, 'KOs ' + this.kills, w - 14, 24, 12, sk.fg, 'right', MONO);
        // mini radar
        const rx = w - 38, ry = h - 38, rR = 26; c.globalAlpha = 0.5; dot(c, rx, ry, rR, sk.panel, { lw: 1 }); c.globalAlpha = 1;
        this.bots.forEach(b => { if (b.dead > 0) return; const q = b.segs[0]; dot(c, rx + q.x / WR * rR, ry + q.y / WR * rR, 1.8, sk.bad, { lw: 0 }); });
        dot(c, rx + hd.x / WR * rR, ry + hd.y / WR * rR, 2.6, sk.pal[0], { lw: 0 });
        flashFx(c, this); endVeil(this);
      }
    }, MIX);
  }

  /* --- agar: Blobs --- */
  function makeBlobs(sk) {
    const HALF = 1300, NBOT = 14, NF = 520;
    const rad = m => 4.1 * Math.sqrt(m);
    const spd = r => 235 * Math.pow(22 / (r + 8), 0.52);
    return Object.assign({
      sk, hold: true, title: 'Blobs', how: 'Steer with your finger. Eat smaller blobs.',
      state: 'ready', score: 0, best: 0, dead: 0, shake: 0, flash: 0, floats: [], me: null, bots: [], food: [], ptr: null, down: false, kills: 0,
      layout() { },
      mkBot(big) { return { x: rand(-HALF, HALF), y: rand(-HALF, HALF), m: big ? rand(60, 260) : rand(12, 70), vx: 0, vy: 0, tt: 0, dx: 0, dy: 0, col: Math.floor(rand(0, 4)), name: rname(), respawn: 0 }; },
      reset() {
        this.me = { x: 0, y: 0, m: 20, vx: 0, vy: 0 }; this.bots = []; for (let i = 0; i < NBOT; i++) this.bots.push(this.mkBot(i % 4 === 0));
        this.food = []; for (let i = 0; i < NF; i++) this.food.push({ x: rand(-HALF, HALF), y: rand(-HALF, HALF), c: Math.floor(rand(0, 4)) });
        this.floats = []; this.kills = 0; this.score = 20; this.state = 'ready';
      },
      enter() { this.reset(); },
      bind(cv) { pointerAim(this, cv); },
      tick(dt) {
        this.decay(dt);
        if (this.state === 'dead') { this.dead += dt; return; }
        if (this.state !== 'run') return;
        const me = this.me, mr = rad(me.m);
        // me
        if (this.ptr) { const dx = this.ptr.x - this.w / 2, dy = this.ptr.y - this.h / 2, d = Math.hypot(dx, dy); if (d > 6) { const s = spd(mr) * Math.min(1, d / 60); me.vx += (dx / d * s - me.vx) * Math.min(1, dt * 8); me.vy += (dy / d * s - me.vy) * Math.min(1, dt * 8); } }
        me.x = clamp(me.x + me.vx * dt, -HALF, HALF); me.y = clamp(me.y + me.vy * dt, -HALF, HALF);
        if (me.m > 60) me.m -= me.m * 0.004 * dt;
        // bots
        const all = [me].concat(this.bots.filter(b => b.respawn <= 0));
        this.bots.forEach((b, bi) => {
          if (b.respawn > 0) { b.respawn -= dt; if (b.respawn <= 0) this.bots[bi] = this.mkBot(false); return; }
          const r = rad(b.m); b.tt -= dt;
          if (b.tt <= 0) {
            b.tt = rand(0.15, 0.35); let tx = 0, ty = 0, set = false, best = 1e12;
            for (const o of all) { if (o === b) continue; const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy); const orr = rad(o.m);
              if (orr > r * 1.12 && d < 320 + orr) { tx = -dx; ty = -dy; set = true; break; }
              if (orr * 1.12 < r && d < 380 && d < best) { best = d; tx = dx; ty = dy; set = true; } }
            if (!set) { best = 1e12; for (let i = 0; i < this.food.length; i += 2) { const f = this.food[i], dx = f.x - b.x, dy = f.y - b.y, d = dx * dx + dy * dy; if (d < best && d < 300 * 300) { best = d; tx = dx; ty = dy; set = true; } } }
            if (!set) { tx = rand(-1, 1); ty = rand(-1, 1); }
            const L = Math.hypot(tx, ty) || 1; b.dx = tx / L; b.dy = ty / L;
          }
          const s = spd(r) * 0.92; b.vx += (b.dx * s - b.vx) * Math.min(1, dt * 5); b.vy += (b.dy * s - b.vy) * Math.min(1, dt * 5);
          b.x = clamp(b.x + b.vx * dt, -HALF, HALF); b.y = clamp(b.y + b.vy * dt, -HALF, HALF);
        });
        // food
        const eatFood = (o, isMe) => { const r = rad(o.m); for (let i = this.food.length - 1; i >= 0; i--) { const f = this.food[i]; if ((f.x - o.x) ** 2 + (f.y - o.y) ** 2 < r * r) { o.m += 1.6; this.food[i] = { x: rand(-HALF, HALF), y: rand(-HALF, HALF), c: Math.floor(rand(0, 4)) }; if (isMe && i % 4 === 0) sfx(500, 0.03, 0.025); } } };
        eatFood(me, true); this.bots.forEach(b => { if (b.respawn <= 0) eatFood(b, false); });
        // cells eat cells
        const pairs = (a, b2) => { const ra = rad(a.m), rb = rad(b2.m), d = Math.hypot(a.x - b2.x, a.y - b2.y); if (ra > rb * 1.12 && d < ra - rb * 0.35) return 1; if (rb > ra * 1.12 && d < rb - ra * 0.35) return -1; return 0; };
        for (const b of this.bots) {
          if (b.respawn > 0) continue; const r = pairs(me, b);
          if (r === 1) { me.m += b.m; b.respawn = 2.5; this.kills++; this.floats.push({ t: '+' + Math.floor(b.m), x: this.w / 2, y: this.h * 0.4, age: 0, c: 'good' }); sfx(620, 0.1, 0.06); }
          else if (r === -1) { this.shake = 0.8; this.flash = 0.5; sfx(140, 0.4, 0.07, 'sawtooth'); buzz(80); this.finish(); return; }
        }
        for (let i = 0; i < this.bots.length; i++) for (let j = i + 1; j < this.bots.length; j++) {
          const a = this.bots[i], b = this.bots[j]; if (a.respawn > 0 || b.respawn > 0) continue; const r = pairs(a, b);
          if (r === 1) { a.m += b.m; b.respawn = 2.5; } else if (r === -1) { b.m += a.m; a.respawn = 2.5; }
        }
        this.score = Math.floor(me.m); this.best = Math.max(this.best, this.score);
      },
      draw() {
        const c = this.ctx, w = this.w, h = this.h, sk = SK, me = this.me, r = rad(me.m), z = Math.max(0.3, 1.15 * Math.pow(30 / (r + 12), 0.5));
        drawBg(c, w, h);
        const cell = (o, col, name, isMe) => {
          const rr_ = rad(o.m); dot(c, o.x, o.y, rr_, col, { lw: sk.lw ? Math.min(3, sk.lw) / z : 0 });
          if (!sk.lw) { c.beginPath(); c.arc(o.x, o.y, rr_, 0, TAU); c.lineWidth = 3 / z; c.strokeStyle = 'rgba(0,0,0,.18)'; c.stroke(); }
          if (rr_ * z > 14) txt(c, name, o.x, o.y, clamp(rr_ * 1.5 / Math.max(3, name.length), 9, 24), onC(col), 'center');
        };
        worldFrame(c, this, me.x, me.y, z, () => {
          worldGrid(c, this, me.x, me.y, z, 50, sk.dark ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.07)');
          c.strokeStyle = sk.bad; c.lineWidth = 6; c.strokeRect(-HALF - 3, -HALF - 3, HALF * 2 + 6, HALF * 2 + 6);
          this.food.forEach(f => { if (Math.abs(f.x - me.x) > this.W / z / 2 + 10 || Math.abs(f.y - me.y) > this.H / z / 2 + 10) return; dot(c, f.x, f.y, 5, sk.pal[f.c % 4], { lw: 0 }); });
          const list = this.bots.filter(b => b.respawn <= 0).map(b => ({ o: b, col: sk.pal[b.col % 4], name: b.name })); list.push({ o: me, col: sk.pal[0], name: 'you' });
          list.sort((a, b) => a.o.m - b.o.m).forEach(it => cell(it.o, it.col, it.name, it.o === me));
        });
        drawFloats(c, this);
        hud(c, this, 'MASS', 0, 0); txt(c, 'EATEN ' + this.kills, w - 14, 24, 12, sk.fg, 'right', MONO);
        flashFx(c, this); endVeil(this);
      }
    }, MIX);
  }

  /* --- hole.io: Hole --- */
  function makeHole(sk, goods) {
    const HALF = 700, TIME = 75;
    const KINDS = [['person', 5, 9, 90], ['crate', 11, 17, 40], ['car', 14, 20, 26], ['tree', 16, 26, 28], ['house', 28, 40, 20], ['block', 46, 66, 11], ['tower', 82, 108, 4]];
    return Object.assign({
      sk, hold: true, title: 'Hole', how: 'Steer the hole. Swallow everything smaller than it.',
      state: 'ready', score: 0, best: 0, dead: 0, shake: 0, flash: 0, floats: [], hx: 0, hy: 0, R: 26, objs: [], ptr: null, down: false, time: TIME, eaten: 0,
      layout() { },
      reset() {
        this.hx = 0; this.hy = 0; this.R = 26; this.time = TIME; this.score = 0; this.eaten = 0; this.floats = []; this.objs = [];
        KINDS.forEach((k, ki) => { for (let i = 0; i < k[3]; i++) {
          let x, y, tries = 0; do { x = rand(-HALF + 40, HALF - 40); y = rand(-HALF + 40, HALF - 40); tries++; } while (Math.hypot(x, y) < 70 && tries < 20);
          this.objs.push({ k: k[0], r: rand(k[1], k[2]), x, y, f: 0, col: Math.floor(rand(0, 4)), rot: rand(0, 3), label: k[0] === 'person' ? '' : pick(goods) });
        } });
        this.state = 'ready';
      },
      enter() { this.reset(); },
      bind(cv) { pointerAim(this, cv); },
      tick(dt) {
        this.decay(dt);
        if (this.state === 'dead') { this.dead += dt; return; }
        if (this.state !== 'run') return;

      if (a === 'like') JING('pop'); else if (a === 'share') SFX(660, 0.12, 0.06); else if (a === 'follow') SFX(540, 0.1, 0.06, 'square'); else if (a === 'comment') SFX(440, 0.08, 0.05);
    }, true);
  })();


  /* ===== search ===== */
  (function () {
    const st = document.createElement('style');
    st.textContent = '#sbtn{position:absolute;top:calc(15px + var(--sat,0px));right:98px;z-index:30;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--hdc,#fff);color:var(--hdi,#111);cursor:pointer;pointer-events:auto;padding:0}#sbtn svg{width:16px;height:16px}' +
      '#sov{position:absolute;inset:0;z-index:60;background:rgba(10,10,14,.92);backdrop-filter:blur(10px);display:none;flex-direction:column;padding:calc(16px + var(--sat,0px)) 16px var(--sab,0px);color:#fff}#sov.on{display:flex}' +
      '#sov .sr{display:flex;gap:8px;align-items:center}#sin{flex:1;min-width:0;height:42px;border-radius:21px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:500 16px system-ui,sans-serif;padding:0 16px;outline:none}#sin:focus{border-color:#fff}' +
      '#sx{border:0;background:none;color:#fff;font:600 14px system-ui,sans-serif;padding:8px;cursor:pointer}#sl{flex:1;overflow:auto;margin:12px -16px 0;padding:0 16px 24px}' +
      '#sl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;padding:11px 2px;cursor:pointer}#sl b{display:block;font:700 16px system-ui,sans-serif}#sl span{display:block;font:400 12px system-ui,sans-serif;opacity:.65;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#sl p{opacity:.6;font:400 14px system-ui,sans-serif;padding:20px 2px}';
    document.head.appendChild(st);
    const btn = document.createElement('button'); btn.id = 'sbtn'; btn.type = 'button'; btn.setAttribute('aria-label', 'Search games');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>';
    const ov = document.createElement('div'); ov.id = 'sov';
    ov.innerHTML = '<div class="sr"><input id="sin" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games"><button id="sx" type="button">Cancel</button></div><div id="sl"></div>';
    phone.appendChild(btn); phone.appendChild(ov);
    const inp = ov.querySelector('#sin'), list = ov.querySelector('#sl');
    const render = () => {
      const q = inp.value.trim().toLowerCase(), toks = q.split(/\s+/).filter(Boolean), rows = [];
      SLIDES.forEach((s, i) => { const hay = (s.title + ' ' + s.tags + ' ' + s.desc + ' ' + s.handle).toLowerCase(); if (toks.every(t => hay.indexOf(t) >= 0)) rows.push([i, s, s.title.toLowerCase().indexOf(q) === 0 ? 0 : s.title.toLowerCase().indexOf(q) > 0 ? 1 : 2]); });
      rows.sort((a, b) => a[2] - b[2] || (a[1].title < b[1].title ? -1 : 1));
      list.innerHTML = '';
      if (!rows.length) { const p = document.createElement('p'); p.textContent = 'No games match "' + inp.value.trim() + '". Try a different word.'; list.appendChild(p); return; }
      rows.slice(0, 60).forEach(r => { const b = document.createElement('button'); b.type = 'button'; const t = document.createElement('b'); t.textContent = r[1].title; const d = document.createElement('span'); d.textContent = r[1].tags + '  by @' + r[1].handle; b.appendChild(t); b.appendChild(d); b.addEventListener('click', () => { close(); feed.scrollTo({ top: r[0] * feed.clientHeight }); }); list.appendChild(b); });
    };
    const open = () => { ov.classList.add('on'); inp.value = ''; render(); setTimeout(() => { try { inp.focus(); } catch (_) {} }, 50); };
    const close = () => { ov.classList.remove('on'); inp.blur(); };
    btn.addEventListener('click', open); ov.querySelector('#sx').addEventListener('click', close); inp.addEventListener('input', render);
    ['keydown', 'keyup'].forEach(t => ov.addEventListener(t, e => { e.stopPropagation(); if (t === 'keydown' && e.key === 'Escape') close(); }));
  })();

  { const u = document.getElementById('navUp'), d = document.getElementById('navDn'); if (u) u.addEventListener('click', () => go(-1)); if (d) d.addEventListener('click', () => go(1)); }

  addEventListener('keyup', e => { const g = games[cur]; if (g && g.key && !paused && /e\.type === 'keydown'/.test(String(g.key))) { if (g.key(e)) e.preventDefault(); } });

})();
</script>
