<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GregSnap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-shaped vertical feed. Each slide is a playable game card with a rail on the right and a caption underneath. */
:root{
  --ink:#0c1615;
  --paper:#f2f6f1;
  --yellow:#ffe033;
  --coral:#ff5a4e;
  --mint:#5be3b0;
  --green:#12a06a;
  --stage:#050a0a;
  --bezel:#1a2423;
  --muted:#9fb3ad;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box;margin:0;background:var(--stage);color:var(--paper);
  font:400 14px/1.4 var(--body);
  display:flex;justify-content:center;align-items:center;overflow:hidden;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.phone{
  position:relative;flex:none;height:100%;max-height:880px;aspect-ratio:9/19;max-width:100%;min-width:0;
  border-radius:38px;overflow:hidden;background:#000;
  box-shadow:0 0 0 7px var(--bezel),0 30px 80px rgba(0,0,0,.6);
}
@media (max-width:520px){.phone{border-radius:22px}}

.top{
  position:absolute;top:0;left:0;right:0;height:58px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none;
}
.brand{display:flex;align-items:center;gap:8px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font:800 18px var(--display)}
.word{font:800 20px var(--display);letter-spacing:-.03em}
.live{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.feed{
  position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;
  overscroll-behavior:contain;outline:none;
}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}

.play{
  position:absolute;top:58px;bottom:150px;left:10px;right:68px;border-radius:20px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(242,246,241,.14);
}
.play canvas{display:block;width:100%;height:100%;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.play canvas.hold{touch-action:none}

.rail{position:absolute;right:8px;bottom:150px;width:52px;display:flex;flex-direction:column;align-items:center;gap:9px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);color:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.rbtn{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:0;color:var(--paper);font:500 11px var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.rbtn .ic{width:44px;height:44px;border-radius:50%;background:rgba(242,246,241,.13);display:grid;place-items:center}
.rbtn svg{width:24px;height:24px}
.rbtn.on .ic{color:var(--coral)}
.rbtn:focus-visible,.follow:focus-visible,.sheet button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:12px}
.rbtn.pulse .ic{animation:pop .3s}
@media (max-height:660px){.rbtn[data-act="next"]{display:none}}
@keyframes pop{50%{transform:scale(1.22)}}

.cap{
  position:absolute;left:0;right:0;bottom:0;height:150px;box-sizing:border-box;padding:10px 16px 14px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:linear-gradient(transparent,rgba(0,0,0,.4));
}
.who{display:flex;align-items:center;gap:10px;font:600 14px var(--body)}
.follow{border:1.5px solid var(--paper);background:none;color:var(--paper);border-radius:8px;padding:2px 10px;font:600 12px var(--body);cursor:pointer}
.follow.on{background:var(--paper);color:var(--ink)}
.ttl{font:800 21px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.desc{margin:0;font-size:13px;color:rgba(242,246,241,.88);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{color:var(--yellow)}
.music{display:flex;align-items:center;gap:8px;font:400 12px var(--mono);color:var(--paper)}
.mq{overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.mq span{display:inline-block;padding-left:100%;animation:marq 10s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}

.scrim{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;height:56%;z-index:10;background:#111c1b;border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;
}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font:800 16px var(--display);border-bottom:1px solid rgba(242,246,241,.1)}
.sheet header button{background:none;border:0;color:var(--paper);font:600 13px var(--body);cursor:pointer;padding:4px 8px}
.sheet ul{list-style:none;margin:0;padding:12px 16px;overflow:auto;display:grid;gap:14px;align-content:start}
.sheet .u{font:500 12px var(--mono);color:var(--muted)}
.sheet .t{font-size:14px}

[hidden]{display:none!important}
.rbtn.dn .ic{background:rgba(138,92,255,.35);color:#d9ccff}
.rbtn.dn svg{width:27px;height:27px}
.who2{display:flex;align-items:center;gap:12px}
.av2{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--display);color:var(--ink);flex:none}
.who2 b{display:block;font:800 16px var(--display)}
.who2 small{display:block;font:500 11px var(--mono);color:var(--muted)}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0;border:0;border-radius:10px;padding:12px;background:rgba(242,246,241,.08);color:var(--paper);font:500 13px var(--mono)}
.urlrow button{border:0;border-radius:10px;padding:0 14px;background:var(--paper);color:var(--ink);font:700 13px var(--body);cursor:pointer;min-width:96px}
.urlrow button:focus-visible,.linkbtn:focus-visible,.urlrow input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.linka{text-decoration:none}
.linkbtn{border:0;background:none;color:var(--yellow);font:600 13px var(--body);cursor:pointer;padding:6px;text-align:center}
.sdesc{margin:0;font:600 14px var(--body);color:var(--paper)}
.bt{display:grid;gap:2px;min-width:0}
.bt .word{line-height:1}
.galchip{pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;cursor:pointer;color:var(--paper);background:rgba(138,92,255,.3);box-shadow:inset 0 0 0 1.5px rgba(167,139,250,.75);border-radius:999px;padding:4px 5px 4px 10px;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.galchip svg{width:18px;height:18px;color:#c9b8ff;display:block}
.galchip .plus{width:22px;height:22px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font:800 16px/1 var(--body)}
.galchip:focus-visible,.spinbtn:focus-visible,.donate:focus-visible,.amts button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.crate{height:auto;max-height:84%}
.sheet.small{height:auto;max-height:80%}
.sheet header .hr{display:flex;gap:2px}
.cbody{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px 20px;display:grid;gap:12px;align-content:start}
.bal{display:flex;align-items:center;justify-content:space-between;font:500 11px var(--mono);color:var(--muted);letter-spacing:.05em}
.bal b{display:flex;align-items:center;gap:8px;font:800 28px var(--display);color:var(--paper);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal b svg{width:24px;height:24px;color:#c9b8ff}
.reelwrap{position:relative;border-radius:14px;background:#0b1413;box-shadow:inset 0 0 0 1px rgba(242,246,241,.12);overflow:hidden}
.reelwrap::before,.reelwrap::after{content:"";position:absolute;top:0;bottom:0;width:48px;z-index:2;pointer-events:none}
.reelwrap::before{left:0;background:linear-gradient(90deg,#0b1413,transparent)}
.reelwrap::after{right:0;background:linear-gradient(270deg,#0b1413,transparent)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--yellow);z-index:3;box-shadow:0 0 12px rgba(255,224,51,.8)}
.marker::before,.marker::after{content:"";position:absolute;left:50%;margin-left:-7px;border:7px solid transparent}
.marker::before{top:0;border-top-color:var(--yellow)}
.marker::after{bottom:0;border-bottom-color:var(--yellow)}
.reel{padding:14px 0;overflow:hidden}
.strip{display:flex;will-change:transform}
.it{flex:none;width:88px;height:112px;margin-right:6px;border-radius:10px;background:#16201f;background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--c) 28%,transparent),transparent 68%),#16201f;box-shadow:inset 0 0 0 1px rgba(242,246,241,.09);display:grid;place-items:center;align-content:center;gap:2px;text-align:center;color:var(--paper)}
.it svg{width:34px;height:34px;color:var(--c)}
.it b{font:800 20px var(--display);letter-spacing:-.02em}
.it small{font:500 9px var(--mono);color:var(--muted);letter-spacing:.06em}
.it.none svg{opacity:.3}
.it.none b{font-size:14px;line-height:1.05;color:var(--muted)}
.it.dim{opacity:.35;transition:opacity .4s}
.it.win{box-shadow:inset 0 0 0 1px rgba(242,246,241,.55),0 0 24px rgba(255,255,255,.16);transform:scale(1.05)}
.result{margin:0;min-height:24px;text-align:center;font:800 19px var(--display);letter-spacing:-.01em;text-wrap:balance}
.spinbtn,.donate{border:0;border-radius:14px;padding:14px;cursor:pointer;font:800 17px var(--display);color:var(--ink);display:flex;justify-content:center;align-items:center;gap:10px}
.spinbtn{background:linear-gradient(90deg,var(--yellow),#ffb703)}
.donate{background:linear-gradient(90deg,var(--mint),#7dd6ff)}
.spinbtn small{font:500 11px var(--mono);background:rgba(12,22,21,.15);border-radius:999px;padding:2px 8px}
.spinbtn:disabled,.donate:disabled{opacity:.5;cursor:default}
.sub{margin:0;font:500 11px var(--mono);color:var(--muted);text-align:center}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amts button{border:0;border-radius:10px;padding:10px 4px;background:rgba(242,246,241,.08);color:var(--paper);font:600 13px var(--mono);cursor:pointer}
.amts button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

.gift{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(138,92,255,.6),rgba(5,10,10,.82) 72%);animation:gfade 2.8s ease both}
.gwrap{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;padding:0 16px}
.gsw{width:150px;height:150px;color:#d9ccff;animation:gspin 2.4s cubic-bezier(.2,.7,.2,1) both}
.gsw svg{width:100%;height:100%;display:block}
.gl{margin:0;font:800 30px/1 var(--display);letter-spacing:-.02em;animation:gtext .6s .25s ease both}
.gsub{margin:0;font:500 12px var(--mono);color:rgba(242,246,241,.85);animation:gtext .6s .4s ease both}
.gift i{position:absolute;left:50%;top:30%;width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:gfly 1.6s .2s ease-out both}
@keyframes gfade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes gspin{0%{transform:rotate(-300deg) scale(.15)}100%{transform:rotate(30deg) scale(1.05)}}
@keyframes gtext{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gfly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.gift,.gift *{animation:none!important}}

@media (prefers-reduced-motion:reduce){
  .mq span,.live i{animation:none}
  .mq span{padding-left:0}
  .sheet{transition:none}
}
</style>

</head>
<body>
<main class="phone" id="phone">
  <div class="top">
    <div class="brand"><span class="mark">G</span><div class="bt"><span class="word">GregSnap</span><div class="live"><i></i><span id="online">4,812,330,119</span> online</div></div></div>
    <button type="button" class="galchip" id="galchip" aria-label="Open Galaxy Crate"><span id="galIcon"></span><span id="galn">0</span><span class="plus">+</span></button>
  </div>
  <div class="feed" id="feed" tabindex="0" aria-label="GregSnap game feed"></div>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" aria-label="Comments">
    <header><span id="sheetTitle">Comments</span><button type="button" data-closeall>Close</button></header>
    <ul id="sheetList"></ul>
  </section>
  <section class="sheet crate" id="crate" aria-label="Galaxy Crate">
    <header><span>Galaxy Crate</span><span class="hr"><button type="button" id="snd" aria-pressed="true">Sound on</button><button type="button" data-closeall>Close</button></span></header>
    <div class="cbody" id="paneCrate">
      <div class="bal"><span>YOUR GALAXIES</span><b><span id="balIcon"></span><span id="balN">0</span></b></div>
      <div class="reelwrap"><div class="marker"></div><div class="reel" id="reel"><div class="strip" id="strip"></div></div></div>
      <p class="result" id="result" aria-live="polite">Open a crate. Win galaxies. Or don't.</p>
      <button type="button" class="spinbtn" id="openBtn">OPEN CRATE <small>$10.00</small></button>
      <p class="sub">Crates opened: <span id="openedN">0</span></p>
    </div>
  </section>
  <section class="sheet small" id="dsheet" aria-label="Donate galaxies">
    <header><span>Donate galaxies</span><button type="button" data-closeall>Close</button></header>
    <div class="cbody">
      <div class="who2"><span class="av2" id="dAv"></span><div><b id="dName"></b><small id="dGame"></small></div></div>
      <div class="bal"><span>YOUR GALAXIES</span><b><span id="dBalIcon"></span><span id="dBal">0</span></b></div>
      <div class="amts" id="amts">
        <button type="button" data-amt="10" aria-pressed="true">10</button>
        <button type="button" data-amt="100" aria-pressed="false">100</button>
        <button type="button" data-amt="1000" aria-pressed="false">1,000</button>
        <button type="button" data-amt="all" aria-pressed="false">ALL</button>
      </div>
      <button type="button" class="donate" id="donateBtn">DONATE</button>
      <p class="sub" id="dHint"></p>
      <button type="button" class="linkbtn" id="getMore">Get more galaxies</button>
    </div>
  </section>
  <section class="sheet small" id="ssheet" aria-label="Share">
    <header><span>Share</span><button type="button" data-closeall>Close</button></header>
    <div class="cbody">
      <p class="sdesc" id="sTitle"></p>
      <div class="urlrow"><input id="shareUrl" type="text" readonly value="https://fazegregpaul.com" aria-label="Link to share"><button type="button" id="copyBtn">Copy link</button></div>
      <a class="spinbtn linka" id="openSite" href="https://fazegregpaul.com" target="_blank" rel="noopener">Open fazegregpaul.com</a>
    </div>
  </section>
  <div class="gift" id="gift" hidden aria-hidden="true">
    <div class="gwrap">
      <i style="--x:-130px;--y:-90px"></i><i style="--x:130px;--y:-80px"></i><i style="--x:-100px;--y:110px"></i><i style="--x:110px;--y:120px"></i>
      <i style="--x:-40px;--y:-150px"></i><i style="--x:50px;--y:-140px"></i><i style="--x:-150px;--y:20px"></i><i style="--x:150px;--y:30px"></i>
      <div class="gsw" id="giftIcon"></div>
      <p class="gl" id="giftTitle"></p>
      <p class="gsub" id="giftSub"></p>
    </div>
  </div>
</main>

<script>
(() => {
  const cs = getComputedStyle(document.documentElement);
  const C = {};
  ['ink','paper','yellow','coral','mint','green'].forEach(k => C[k] = cs.getPropertyValue('--' + k).trim());
  const DISPLAY = '"Bricolage Grotesque","Arial Black",system-ui,sans-serif';
  const MONO = '"DM Mono",ui-monospace,Menlo,monospace';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fmt = n => n >= 1e12 ? (n / 1e12).toFixed(2) + 'T' : n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n));

  function txt(c, s, x, y, size, col, al, font, wt) {
    c.font = (wt || 800) + ' ' + size + 'px ' + (font || DISPLAY);
    c.fillStyle = col; c.textAlign = al || 'left'; c.textBaseline = 'middle';
    c.fillText(s, x, y);
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
  }

  /* ---------- game loop plumbing ---------- */
  const games = [];
  let cur = 0;
  let paused = false;
  function mount(canvas, g) {
    g.canvas = canvas; g.ctx = canvas.getContext('2d'); g.w = 0; g.h = 0;
    const fit = () => {
      const r = canvas.parentElement.getBoundingClientRect();
      const d = Math.min(window.devicePixelRatio || 1, 2);
      g.w = Math.round(r.width); g.h = Math.round(r.height);
      if (!g.w || !g.h) return;
      canvas.width = g.w * d; canvas.height = g.h * d;
      g.ctx.setTransform(d, 0, 0, d, 0, 0);
      if (g.layout) g.layout();
      if (g.inited) g.draw();
    };
    new ResizeObserver(fit).observe(canvas.parentElement);
    fit();
    g.reset(); g.inited = true; g.draw();
    games.push(g);
  }
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const g = games[cur];
    if (g && g.w && !paused) { if (g.tick) g.tick(dt); g.draw(); }
    requestAnimationFrame(frame);
  }

  /* ---------- game 1: Steady Greg (buzz wire) ---------- */
  const wire = {
    level: 1, zaps: 0, wins: 0, state: 'idle', pts: [], ring: null, off: null, t0: 0, elapsed: 0,
    shake: 0, flash: 0, msg: '', msgT: 0, pid: null, wait: 0, start: null, end: null,
    tol() { return Math.max(7.5, 14 - (this.level - 1) * 0.9); },
    build() {
      const w = this.w, h = this.h, pad = 84, cx = w / 2;
      const A = Math.min(w * 0.36, 38 + this.level * 12);
      const f1 = 0.016 + this.level * 0.0014, f2 = f1 * 2.3, p1 = rand(0, TAU), p2 = rand(0, TAU);
      const sm = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      this.pts = [];
      for (let y = h - pad; y >= pad; y -= 3) {
        const t = (h - pad - y) / (h - 2 * pad);
        const env = sm(t / 0.1) * sm((1 - t) / 0.1);
        this.pts.push({ x: cx + A * env * (0.65 * Math.sin(y * f1 + p1) + 0.35 * Math.sin(y * f2 + p2)), y });
      }
      this.start = this.pts[0]; this.end = this.pts[this.pts.length - 1];
    },
    layout() { this.build(); this.state = 'idle'; this.ring = null; },
    reset() { this.build(); this.state = 'idle'; this.ring = null; },
    enter() { this.state = 'idle'; this.ring = null; this.pid = null; },
    raw(e) { const r = this.canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; },
    near(p) { let m = 1e9; for (const q of this.pts) { const d = Math.hypot(p.x - q.x, p.y - q.y); if (d < m) m = d; } return m; },
    say(m) { this.msg = m; this.msgT = m ? 2.2 : 0; },
    down(e) {
      if (this.state === 'won' || this.state === 'zapped' || !this.start) return;
      const p = this.raw(e);
      if (Math.hypot(p.x - this.start.x, p.y - this.start.y) < 72) {
        this.off = { x: this.start.x - p.x, y: this.start.y - p.y };
        this.state = 'holding'; this.ring = { x: this.start.x, y: this.start.y };
        this.t0 = performance.now(); this.pid = e.pointerId;
        try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
        this.say('');
      } else this.say('Start on the yellow pad.');
    },
    move(e) {
      if (this.state !== 'holding' || e.pointerId !== this.pid) return;
      const p = this.raw(e);
      this.ring = { x: p.x + this.off.x, y: p.y + this.off.y };
      if (this.near(this.ring) > this.tol()) { this.zap(); return; }
      if (Math.hypot(this.ring.x - this.end.x, this.ring.y - this.end.y) < 24) this.win();

  /* ---------- game 2: Gregbit (orbit lanes) ---------- */
  const orbit = {
    state: 'ready', t: 0, score: 0, best: 0, th: 0, lane: 0, rr: 0, obs: [], spawn: 0, shake: 0, flash: 0, dead: 0, trail: [],
    geom() { this.cx = this.w / 2; this.cy = this.h / 2; this.rI = Math.min(this.w * 0.2, this.h * 0.17); this.rO = Math.min(this.w * 0.38, this.h * 0.31); },
    layout() { this.geom(); },
    reset() { this.geom(); this.state = 'ready'; this.t = 0; this.score = 0; this.th = -Math.PI / 2; this.lane = 0; this.rr = 0; this.obs = []; this.spawn = 0.4; this.trail = []; },
    enter() { this.reset(); },
    omega() { return Math.min(3.6, 2.1 + this.t * 0.05); },
    tap() {
      if (this.state === 'ready') this.state = 'run';
      else if (this.state === 'run') this.lane ^= 1;
      else if (this.state === 'dead' && this.dead > 0.5) { this.reset(); this.state = 'run'; }
    },
    addObs() {
      const a = this.th + rand(1.9, 2.6), lane = Math.random() < 0.5 ? 0 : 1, len = rand(0.35, 0.6);
      for (const o of this.obs) if (o.lane !== lane && Math.abs(o.a - a) < (o.len + len) / 2 + 0.9) return;
      this.obs.push({ a, lane, len });
    },
    die() { this.state = 'dead'; this.dead = 0; this.shake = 1; this.flash = 1; this.best = Math.max(this.best, this.score); },
    tick(dt) {
      this.shake = Math.max(0, this.shake - dt * 3);
      this.flash = Math.max(0, this.flash - dt * 2.5);
      if (this.state === 'dead') { this.dead += dt; return; }
      if (this.state !== 'run') { this.th += 0.8 * dt; return; }
      this.t += dt;
      const om = this.omega();
      this.th += om * dt;
      this.rr += (this.lane - this.rr) * Math.min(1, dt * 13);
      this.spawn -= dt;
      if (this.spawn <= 0) { this.spawn = rand(0.5, 0.9) * 2.1 / om; this.addObs(); }
      const r = this.rI + (this.rO - this.rI) * this.rr;
      this.trail.push({ th: this.th, r }); if (this.trail.length > 16) this.trail.shift();
      for (let i = this.obs.length - 1; i >= 0; i--) {
        const o = this.obs[i];
        if (o.a + o.len / 2 < this.th - 0.35) { this.obs.splice(i, 1); this.score++; continue; }
        const lr = o.lane ? this.rO : this.rI;
        if (Math.abs(r - lr) < 16 && Math.abs(this.th - o.a) < o.len / 2 + 12 / r) { this.die(); break; }
      }
    },
    draw() {
      const c = this.ctx, w = this.w, h = this.h, cx = this.cx, cy = this.cy;
      const bg = c.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, C.coral); bg.addColorStop(1, '#c42f50');
      c.fillStyle = bg; c.fillRect(0, 0, w, h);
      c.save();
      if (this.shake > 0) c.translate(rand(-1, 1) * this.shake * 9, rand(-1, 1) * this.shake * 9);
      c.strokeStyle = 'rgba(12,22,21,.28)'; c.lineWidth = 2; c.setLineDash([3, 7]);
      [this.rI, this.rO].forEach(r => { c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke(); });
      c.setLineDash([]);
      c.lineCap = 'round'; c.lineWidth = 24; c.strokeStyle = C.paper;
      this.obs.forEach(o => { c.beginPath(); c.arc(cx, cy, o.lane ? this.rO : this.rI, o.a - o.len / 2, o.a + o.len / 2); c.stroke(); });
      this.trail.forEach((p, i) => {
        const k = i / this.trail.length;
        c.fillStyle = 'rgba(255,224,51,' + (k * 0.5) + ')';
        c.beginPath(); c.arc(cx + p.r * Math.cos(p.th), cy + p.r * Math.sin(p.th), 9 * k, 0, TAU); c.fill();
      });
      const r = this.rI + (this.rO - this.rI) * this.rr;
      c.fillStyle = C.yellow; c.strokeStyle = C.ink; c.lineWidth = 3;
      c.beginPath(); c.arc(cx + r * Math.cos(this.th), cy + r * Math.sin(this.th), 9, 0, TAU); c.fill(); c.stroke();
      txt(c, String(this.score), cx, cy, 64, C.ink, 'center');
      c.restore();
      if (this.flash > 0) { c.fillStyle = 'rgba(242,246,241,' + (this.flash * 0.5) + ')'; c.fillRect(0, 0, w, h); }
      txt(c, 'GREGBIT', 14, 22, 12, 'rgba(12,22,21,.7)', 'left', MONO, 500);
      txt(c, 'BEST ' + this.best, w - 14, 22, 12, 'rgba(12,22,21,.7)', 'right', MONO, 500);
      if (this.state === 'ready') {
        txt(c, 'TAP TO SWITCH LANES', cx, cy + this.rO + 52, 12, C.paper, 'center', MONO, 500);
        txt(c, 'Dodge the white blocks.', cx, cy - this.rO - 48, 15, C.paper, 'center');
      } else if (this.state === 'dead') {
        txt(c, 'Disrupted.', cx, cy - this.rO - 48, 22, C.paper, 'center');
        txt(c, this.score + ' passed. Tap to retry.', cx, cy + this.rO + 52, 12, C.paper, 'center', MONO, 500);
      }
    }
  };

  /* ---------- game 3: Raise Round (timing) ---------- */
  const ROUNDS = ['Pre-seed', 'Seed', 'Series A', 'Series B', 'Series C', 'Series D', 'Series E', 'Series Greg', 'Series Greg II', 'IPO', 'Hyper IPO', 'Buys Mars', 'Buys the economy'];
  const UNITS = [[1e21, 'sextillion'], [1e18, 'quintillion'], [1e15, 'quadrillion'], [1e12, 'trillion'], [1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand']];
  const money = v => { for (const [u, n] of UNITS) if (v >= u) { const x = v / u; return ['$' + x.toFixed(x >= 100 ? 0 : 1), n]; } return ['$' + Math.round(v), 'dollars']; };
  const GOOD = ['Investors are thrilled.', 'Nobody read the deck.', 'Term sheet signed.', 'Valuation is a feeling.', 'Greg rings a bell.'];
  const BAD = ['Down round. Say "pivot".', 'Investors want to "circle back".', 'Greg was asked to step down. He declined.', 'The deck had a typo.'];
  const raise = {
    val: 250000, lvl: 0, streak: 0, m: 0.1, dir: 1, speed: 0.85, zc: 0.6, zw: 0.3, hist: [], floaters: [], flash: 0, flashGood: true, msg: '', msgT: 0,
    reset() { this.val = 250000; this.lvl = 0; this.streak = 0; this.m = 0.1; this.dir = 1; this.speed = 0.85; this.zw = 0.3; this.zc = rand(0.25, 0.75); this.hist = [Math.log10(this.val)]; this.floaters = []; this.flash = 0; this.msg = 'Tap when the needle is in the green.'; this.msgT = 99; },
    say(m) { this.msg = m; this.msgT = 2.4; },
    pop(t, good) { this.floaters.push({ t, good, age: 0 }); },
    tap() {
      const hit = Math.abs(this.m - this.zc) <= this.zw / 2;
      if (hit) {
        this.streak++;
        const mult = +(1.8 + Math.min(this.streak, 12) * 0.45).toFixed(1);
        this.val *= mult; this.lvl++;
        this.zw = Math.max(0.08, this.zw * 0.9); this.speed = Math.min(2.4, this.speed * 1.07);
        this.pop('x' + mult, true); this.say(pick(GOOD)); this.flashGood = true;
      } else {
        this.streak = 0; this.val = Math.max(1e5, this.val * 0.4); this.lvl = Math.max(0, this.lvl - 1);
        this.zw = Math.min(0.3, this.zw * 1.2);
        this.pop('DOWN ROUND', false); this.say(pick(BAD)); this.flashGood = false;
      }
      this.flash = 0.5;
      this.hist.push(Math.log10(this.val)); if (this.hist.length > 24) this.hist.shift();
      this.zc = rand(this.zw / 2 + 0.03, 1 - this.zw / 2 - 0.03);
    },
    tick(dt) {
      this.m += this.dir * this.speed * dt;
      if (this.m > 1) { this.m = 1; this.dir = -1; } else if (this.m < 0) { this.m = 0; this.dir = 1; }
      this.flash = Math.max(0, this.flash - dt * 2);
      this.msgT = Math.max(0, this.msgT - dt);
      this.floaters.forEach(f => f.age += dt);
      this.floaters = this.floaters.filter(f => f.age < 1.1);
    },
    draw() {
      const c = this.ctx, w = this.w, h = this.h;
      const bg = c.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#f2f6f1'); bg.addColorStop(1, '#d3e8dc');
      c.fillStyle = bg; c.fillRect(0, 0, w, h);
      const name = ROUNDS[Math.min(this.lvl, ROUNDS.length - 1)].toUpperCase();
      c.font = '500 12px ' + MONO;
      const pw = c.measureText(name).width + 24;
      c.fillStyle = C.ink; rr(c, 14, 14, pw, 26, 13); c.fill();
      txt(c, name, 26, 27, 12, C.paper, 'left', MONO, 500);
      txt(c, this.streak ? 'STREAK x' + this.streak : 'NO STREAK', w - 14, 27, 12, 'rgba(12,22,21,.6)', 'right', MONO, 500);
      txt(c, 'VALUATION', w / 2, 66, 11, 'rgba(12,22,21,.55)', 'center', MONO, 500);
      const [num, unit] = money(this.val);
      let fs = 64; c.font = '800 ' + fs + 'px ' + DISPLAY;
      const mw = c.measureText(num).width; if (mw > w - 32) fs = Math.floor(fs * (w - 32) / mw);
      txt(c, num, w / 2, 106, fs, C.ink, 'center');
      txt(c, unit, w / 2, 106 + fs * 0.55 + 14, 22, C.green, 'center');
      const top = Math.min(200, h * 0.38), bot = h - 190;
      if (bot - top > 60) {
        const hs = this.hist, lo = Math.min(...hs) - 0.4, hi = Math.max(...hs) + 0.4;
        const X = i => 20 + (w - 40) * (hs.length < 2 ? 0.5 : i / (hs.length - 1));
        const Y = v => bot - (bot - top) * (v - lo) / (hi - lo);
        c.strokeStyle = 'rgba(12,22,21,.1)'; c.lineWidth = 1;
        for (let i = 0; i < 4; i++) { const y = top + (bot - top) * i / 3; c.beginPath(); c.moveTo(20, y); c.lineTo(w - 20, y); c.stroke(); }
        if (hs.length > 1) {
          c.beginPath(); hs.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
          c.lineTo(X(hs.length - 1), bot); c.lineTo(X(0), bot); c.closePath();
          c.fillStyle = 'rgba(18,160,106,.14)'; c.fill();
          c.beginPath(); hs.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
          c.strokeStyle = C.green; c.lineWidth = 4; c.lineJoin = 'round'; c.stroke();
        }
        const li = hs.length - 1;
        c.fillStyle = C.green; c.beginPath(); c.arc(X(li), Y(hs[li]), 6, 0, TAU); c.fill();
      }
      const mx = 24, mwid = w - 48, my = h - 110, mh = 34;
      c.fillStyle = 'rgba(12,22,21,.14)'; rr(c, mx, my, mwid, mh, 17); c.fill();
      c.fillStyle = C.green; rr(c, mx + (this.zc - this.zw / 2) * mwid, my, this.zw * mwid, mh, 12); c.fill();
      c.fillStyle = C.ink; rr(c, mx + this.m * mwid - 3, my - 10, 6, mh + 20, 3); c.fill();
      txt(c, 'TAP ANYWHERE TO LOCK THE TERM SHEET', w / 2, h - 44, 11, 'rgba(12,22,21,.6)', 'center', MONO, 500);
      if (this.msgT > 0) txt(c, this.msg, w / 2, my - 24, 14, C.ink, 'center');
      this.floaters.forEach(f => {
        c.globalAlpha = 1 - f.age / 1.1;
        txt(c, f.t, w / 2, my - 60 - f.age * 70, 26, f.good ? C.green : C.coral, 'center');
        c.globalAlpha = 1;
      });
      if (this.flash > 0) { c.fillStyle = (this.flashGood ? 'rgba(18,160,106,' : 'rgba(255,90,78,') + (this.flash * 0.25) + ')'; c.fillRect(0, 0, w, h); }
    }
  };

  /* ---------- shared helpers for the extra games ---------- */
  function wrap(c, s, maxW) {
    const words = s.split(' '), lines = []; let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    lines.push(line); return lines;
  }
  function veil(c, w, h, l1, l2) {
    c.fillStyle = 'rgba(12,22,21,.62)'; c.fillRect(0, 0, w, h);
    txt(c, l1, w / 2, h / 2 - 14, 26, C.paper, 'center');
    txt(c, l2, w / 2, h / 2 + 18, 12, C.paper, 'center', MONO, 500);
  }

  /* ---------- game 4: Swipe Ideas (approve or pass) ---------- */
  const IDEAS = [
    ['Uber for Uber', 1], ['Blockchain, but for sandwiches', 1], ['An AI that replaces the AI', 1], ['Air by subscription. $9 a breath', 1],
    ['LinkedIn for dogs', 1], ['Tinder for houseplants', 1], ['Smart socks. They have Wi-Fi', 1], ['Cloud storage for your feelings', 1],
    ['Crypto, but it is a mattress', 1], ['Netflix for staring out windows', 1], ['Metaverse for one person', 1], ['Disrupting Tuesday', 1],
    ['A bakery that sells bread', 0], ['Fixes pipes. Fair price.', 0], ['Software with no AI in it', 0], ['Profitable since day one', 0],
    ['A pen that writes', 0], ['Customer support that answers', 0], ['A product people need', 0], ['A quietly good dentist', 0],
    ['A hardware store that is open', 0], ['A spreadsheet. Just a spreadsheet.', 0], ['Locally owned laundromat', 0], ['A bridge, for crossing', 0]
  ];
  const swipe = {
    state: 'ready', score: 0, best: 0, patience: 1, card: null, dx: 0, dragging: false, sx: 0, moved: 0, fly: null, flash: 0, flashGood: true, shake: 0, dead: 0, pid: null,
    reset() { this.state = 'ready'; this.score = 0; this.patience = 1; this.dx = 0; this.dragging = false; this.fly = null; this.card = pick(IDEAS); },
    enter() { this.reset(); },
    raw(e) { const r = this.canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; },
    kick() {
      if (this.state === 'ready') { this.state = 'run'; return true; }
      if (this.state === 'dead') { if (this.dead > 0.6) { this.reset(); this.state = 'run'; } return true; }
      return false;
    },
    down(e) {
      if (this.kick() || this.fly) return;
      this.dragging = true; this.sx = this.raw(e).x; this.moved = 0; this.dx = 0; this.pid = e.pointerId;
      try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
    },
    move(e) {
      if (!this.dragging || e.pointerId !== this.pid) return;
      this.dx = this.raw(e).x - this.sx; this.moved = Math.max(this.moved, Math.abs(this.dx));
    },
    up(e) {
      if (!this.dragging || e.pointerId !== this.pid) return;
      this.dragging = false;
      if (Math.abs(this.dx) > this.w * 0.18) this.decide(this.dx > 0 ? 1 : -1);
      else if (this.moved < 10) this.decide(this.raw(e).x > this.w / 2 ? 1 : -1);
      else this.dx = 0;
    },
    swipe(d) { if (this.kick()) return; this.decide(d); },
    decide(d) {
      if (this.state !== 'run' || this.fly) return;
      const ok = (d === 1) === !!this.card[1];
      this.fly = { d, t: 0, card: this.card, dx: this.dx }; this.dx = 0;
      if (ok) { this.score++; this.patience = Math.min(1, this.patience + 0.12); this.flashGood = true; this.flash = 0.35; }
      else { this.patience -= 0.3; this.flashGood = false; this.flash = 0.45; this.shake = 0.8; }
      this.card = pick(IDEAS);
      if (this.patience <= 0) { this.state = 'dead'; this.dead = 0; this.best = Math.max(this.best, this.score); }
    },
    tick(dt) {
      this.shake = Math.max(0, this.shake - dt * 3); this.flash = Math.max(0, this.flash - dt * 2.4);
      if (this.fly) { this.fly.t += dt; if (this.fly.t > 0.25) this.fly = null; }
      if (this.state === 'dead') this.dead += dt;
      if (this.state === 'run') {
        this.patience -= dt * (0.07 + Math.min(0.12, this.score * 0.004));
        if (this.patience <= 0) { this.patience = 0; this.state = 'dead'; this.dead = 0; this.best = Math.max(this.best, this.score); }
      }
    },
    draw() {
      const c = this.ctx, w = this.w, h = this.h, cx = w / 2, cy = h * 0.5, cw = w * 0.78, ch = h * 0.32;
      const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1b3a5c'); bg.addColorStop(1, '#0e2237');
      c.fillStyle = bg; c.fillRect(0, 0, w, h);
      c.save();
      if (this.shake > 0) c.translate(rand(-1, 1) * this.shake * 8, 0);
      txt(c, 'INVESTOR PATIENCE', 14, 20, 10, 'rgba(242,246,241,.65)', 'left', MONO, 500);
      txt(c, 'FUNDED ' + this.score, w - 14, 20, 11, C.paper, 'right', MONO, 500);
      c.fillStyle = 'rgba(242,246,241,.14)'; rr(c, 14, 32, w - 28, 10, 5); c.fill();
      c.fillStyle = this.patience > 0.5 ? C.mint : this.patience > 0.25 ? C.yellow : C.coral;
      rr(c, 14, 32, Math.max(0, (w - 28) * this.patience), 10, 5); c.fill();
      txt(c, 'Fund what sounds like the future.', cx, 72, 13, C.paper, 'center', DISPLAY, 600);
      txt(c, 'Pass on anything that works.', cx, 92, 13, 'rgba(242,246,241,.7)', 'center', DISPLAY, 600);
      c.globalAlpha = 0.35; c.fillStyle = C.paper; rr(c, cx - cw * 0.46, cy - ch / 2 + 16, cw * 0.92, ch, 18); c.fill(); c.globalAlpha = 1;
      const drawCard = (card, x, y, rot, alpha) => {
        c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = alpha;
        c.fillStyle = C.paper; rr(c, -cw / 2, -ch / 2, cw, ch, 18); c.fill();
        txt(c, 'PITCH', -cw / 2 + 16, -ch / 2 + 20, 10, 'rgba(12,22,21,.5)', 'left', MONO, 500);
        c.font = '800 24px ' + DISPLAY;
        const lines = wrap(c, card[0], cw - 36);
        lines.forEach((l, i) => txt(c, l, 0, (i - (lines.length - 1) / 2) * 28 + 4, 24, C.ink, 'center'));
        c.restore(); c.globalAlpha = 1;
      };

  const servers = {

  /* ---------- game 6: Stack the Interns ---------- */
  const stack = {
    state: 'ready', blocks: [], cur: null, dir: 1, speed: 0, score: 0, best: 0, cuts: [], perfect: 0, shake: 0, dead: 0, cam: 0, BH: 26,

      this.blocks = [{ x: (this.w - this.baseW) / 2, w: this.baseW }]; this.spawnCur();
    },
    spawnCur() {
      const top = this.blocks[this.blocks.length - 1];
      this.cur = { x: -top.w * 0.4, w: top.w }; this.dir = 1; this.speed = Math.min(520, 190 + this.score * 9);
    },
    enter() { this.reset(); },
    worldY(i) { return this.baseY - (i + 1) * this.BH; },
    tap() {

      const top = this.blocks[this.blocks.length - 1], idx = this.blocks.length;
      const l = Math.max(this.cur.x, top.x), r = Math.min(this.cur.x + this.cur.w, top.x + top.w), ov = r - l;
      if (ov <= 0) {
        this.cuts.push({ x: this.cur.x, w: this.cur.w, y: this.worldY(idx), vy: 0, idx });
        this.state = 'dead'; this.dead = 0; this.shake = 0.6; this.best = Math.max(this.best, this.score); return;
      }
      let nx = l, nw = ov;
      if (Math.abs(this.cur.x - top.x) < 4) {
        nx = top.x; nw = top.w; this.perfect++;
        if (this.perfect >= 2) { const g = Math.min(8, this.baseW - nw); nw += g; nx -= g / 2; }
      } else {
        this.perfect = 0;
        const cutX = this.cur.x < top.x ? this.cur.x : r;
        this.cuts.push({ x: cutX, w: this.cur.w - ov, y: this.worldY(idx), vy: 0, idx });
      }
      this.blocks.push({ x: nx, w: nw }); this.score++; this.spawnCur();
    },
    tick(dt) {
      this.shake = Math.max(0, this.shake - dt * 3);

      }

      c.fillStyle = bg; c.fillRect(0, 0, w, h);

  const popup = {

    gift.hidden = true; void gift.offsetWidth; gift.hidden = false;
    clearTimeout(giftT); giftT = setTimeout(() => { gift.hidden = true; }, 2800);
    beep(392, 0.14, 0.1, 'sine'); setTimeout(() => beep(523, 0.14, 0.1, 'sine'), 110); setTimeout(() => beep(784, 0.35, 0.1, 'sine'), 220);
  }
  $('donateBtn').addEventListener('click', () => {
    const a = amtVal(), s = SLIDES[dTarget];
    if (a <= 0 || a > gal) return;
    gal -= a; s.recv += a; setGal();
    $('dHint').textContent = '@' + s.handle + ' says thank you.';
    showGift(a, '@' + s.handle);
  });
  $('getMore').addEventListener('click', () => showSheet(crate));

  /* share */
  function openShare(i) { $('sTitle').textContent = 'Send ' + SLIDES[i].title + ' to a friend'; $('copyBtn').textContent = 'Copy link'; showSheet(ssheet); }
  $('copyBtn').addEventListener('click', () => {
    const url = $('shareUrl'), btn = $('copyBtn');
    const done = ok => { btn.textContent = ok ? 'Copied' : 'Link selected'; setTimeout(() => { btn.textContent = 'Copy link'; }, 1800); };
    const fallback = () => { url.focus(); url.select(); url.setSelectionRange(0, 99); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} done(ok); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url.value).then(() => done(true), fallback); else fallback();
  });
  setGal();

  document.getElementById('phone').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const slide = b.closest('.slide'); const i = slide ? +slide.dataset.i : cur; const s = SLIDES[i];
    const act = b.dataset.act;
    const pulse = () => { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); };
    if (act === 'like') { s.liked = !s.liked; s.likes += s.liked ? 69e6 : -69e6; b.classList.toggle('on', s.liked); b.querySelector('.n').textContent = fmt(s.likes); pulse(); }
    else if (act === 'share') { s.shares += 21e6; b.querySelector('.n').textContent = fmt(s.shares); pulse(); openShare(i); }
    else if (act === 'donate') openDonate(i);
    else if (act === 'comment') openSheet(i);
    else if (act === 'next') go(1);
    else if (act === 'follow') { const on = b.classList.toggle('on'); b.textContent = on ? 'Following' : 'Follow'; }
  });

  addEventListener('keydown', e => {
    if (paused) { if (e.code === 'Escape') closeAll(); else rigKey(e); return; }
    if (e.code === 'Escape') closeAll();
    else if (e.code === 'Space') { const g = games[cur]; if (g && g.tap) { e.preventDefault(); g.tap(); } }
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { const g = games[cur]; if (g && g.swipe) { e.preventDefault(); g.swipe(e.code === 'ArrowRight' ? 1 : -1); } }
    else if (e.code === 'ArrowDown') { e.preventDefault(); go(1); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); go(-1); }
  });

  /* live user counter */
  let users = 4812330119;
  const onl = document.getElementById('online');
  setInterval(() => { users += Math.floor(rand(200, 900)); onl.textContent = users.toLocaleString('en-US'); }, 140);

  feed.focus({ preventScroll: true });
  requestAnimationFrame(frame);
})();
</script>
