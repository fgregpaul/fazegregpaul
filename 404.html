<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GregSnap</title>
    <meta property="og:title" content="GregSnap">
    <meta property="og:description" content="TikTok for games. Come play.">
    <script>
        /* game links: fazegregpaul.com/chess has no file of its own, so hand it to the app as /?g=chess */
        (function () {
            var p = location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '');
            if (p && /^[A-Za-z0-9%._-]+$/.test(p)) location.replace('/?g=' + encodeURIComponent(decodeURIComponent(p)) + (location.search ? '&' + location.search.slice(1) : '') + location.hash);
        })();
    </script>
